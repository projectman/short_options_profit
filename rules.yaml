# Strategy Rules & Constants for Diagonal Spread Short Options Selection

# Delta filtering range
delta_filter:
  min_delta: 0.10
  max_delta: 0.55

# Strike filtering
strike_filter:
  require_strike_less_than_spot: false  # Removed requirement that strike must be less than underlying spot

# Option selection criteria
option_selection:
  option_type: "Put"
  require_positive_mid: true

# Valuation and Pricing Rule
valuation:
  price_method: "mid"  # Always use medium price for BID/ASK: Mid = (Bid + Ask) / 2
  risk_free_rate: 0.045

# Profit Target Parameters
profit_target:
  target_yield: 0.80           # 80% profit from existing extrinsic value
  target_residual_ratio: 0.20  # Option price reaches 20% of current mid price

# Basis Long Option Position
basis_long:
  symbol: "UPS"
  option_type: "Put"
  strike: 80.0
  expiration_date: "2027-06-17"
  cost_basis: 3.37             # Purchase price per share ($3.37)
  contracts: 1
