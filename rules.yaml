# Strategy Rules & Constants for Short Options Selection (Diagonal Spreads, Cash Protected Puts, Vertical Spreads)

# Delta filtering range for short puts
delta_filter:
  min_delta: 0.15
  max_delta: 0.55

# Strike filtering
strike_filter:
  require_strike_less_than_spot: false  # Allows ITM/ATM strikes

# Option selection criteria
option_selection:
  option_type: "Put"
  require_positive_mid: true

# Valuation and Pricing Rule
valuation:
  price_method: "mid"  # Always use medium price for BID/ASK: Mid = (Bid + Ask) / 2
  risk_free_rate: 0.045

# Profit Target Parameters by Strategy Type
profit_target:
  diagonal_spread:
    target_yield: 0.80           # 80% profit from extrinsic value for calendar/diagonal spreads
    target_residual_ratio: 0.20  # Option price decays to 20% residual extrinsic
  cash_protected_put:
    target_yield: 0.50           # 50% profit from extrinsic value for standalone short puts
    target_residual_ratio: 0.50  # Option price decays to 50% residual extrinsic
  vertical_spread:
    target_yield: 0.50           # 50% profit from net credit for vertical credit spreads
    target_residual_ratio: 0.50  # Option price decays to 50%

# Vertical Spread Long Put Selection Rules
vertical_spread:
  target_delta_offset: 0.20      # Target delta difference (|delta_short| - 0.20)
  min_long_delta: 0.05           # Minimum delta bound for long put (delta cannot be less than 0.05)

# Basis Long Positions File (Used for Diagonal Spreads)
positions_file: "basis_long_positions.csv"
