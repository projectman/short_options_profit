# Strategy Rules & Constants for Short Options Selection (Diagonal Spreads & Cash Protected Puts)

# Delta filtering range
delta_filter:
  min_delta: 0.15
  max_delta: 0.55

# Strike filtering
strike_filter:
  require_strike_less_than_spot: false  # Allows ITM/ATM strikes

# Option selection criteria
option_selection:
  option_type: "Put"
  require_positive_mid: true

# Valuation and Pricing Rule
valuation:
  price_method: "mid"  # Always use medium price for BID/ASK: Mid = (Bid + Ask) / 2
  risk_free_rate: 0.045

# Profit Target Parameters by Strategy Type
profit_target:
  diagonal_spread:
    target_yield: 0.80           # 80% profit from extrinsic value for calendar/diagonal spreads
    target_residual_ratio: 0.20  # Option price decays to 20% residual extrinsic
  cash_protected_put:
    target_yield: 0.50           # 50% profit from extrinsic value for standalone short puts
    target_residual_ratio: 0.50  # Option price decays to 50% residual extrinsic

# Basis Long Positions File
positions_file: "basis_long_positions.csv"
